<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rivals Legends: Adventure & Collection</title>
  <style>
    :root {
      --hud: rgba(12, 16, 30, 0.72);
      --accent: #7af2ff;
      --danger: #ff5a7a;
      --ok: #7bff9e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: Inter, system-ui, Arial, sans-serif; background:#02040a; color:#fff; }
    #hud {
      position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column;
      justify-content: space-between; padding: 14px;
    }
    .panel {
      pointer-events: auto; background: var(--hud); backdrop-filter: blur(8px);
      border: 1px solid rgba(122, 242, 255, 0.25); border-radius: 12px; padding: 10px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    #top { display:flex; gap:10px; align-items:center; flex-wrap: wrap; }
    #status { margin-left:auto; color:var(--accent); font-weight:700; }
    #bottom { display:flex; gap:10px; align-items:end; }
    #collection { min-width: 250px; }
    button, select {
      background:#0f1c35; color:#fff; border:1px solid rgba(255,255,255,0.25);
      border-radius:8px; padding:8px 10px; font-weight:600;
    }
    .tag { padding: 2px 8px; border-radius: 999px; font-size: 12px; margin-right:6px; border:1px solid rgba(255,255,255,0.2); }
    .hp { color: var(--danger); }
    .xp { color: var(--ok); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <div id="top" class="panel">
      <strong>Rivals Legends (Web Prototype)</strong>
      <span class="tag">WASD Move</span><span class="tag">Shift Dash</span><span class="tag">Click Attack</span>
      <select id="modeSelect">
        <option value="adventure">Adventure</option>
        <option value="collection">Collection Hunt</option>
        <option value="rivals">Rivals Arena</option>
      </select>
      <button id="resetBtn">Reset Run</button>
      <div id="status">Loading...</div>
    </div>
    <div id="bottom">
      <div class="panel" id="stats"></div>
      <div class="panel" id="collection"></div>
    </div>
  </div>

<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x081126, 0.016);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x89a4ff, 0.45));
const moon = new THREE.DirectionalLight(0xdde9ff, 1.2);
moon.position.set(16, 24, 10);
moon.castShadow = true;
moon.shadow.mapSize.width = 2048;
moon.shadow.mapSize.height = 2048;
scene.add(moon);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200, 40, 40),
  new THREE.MeshStandardMaterial({ color: 0x1d3046, roughness: 0.82, metalness: 0.16 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const player = new THREE.Group();
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.45, 1.1, 6, 10), new THREE.MeshStandardMaterial({ color: 0x57f0ff, emissive:0x113a44, roughness:0.3, metalness:0.2 }));
body.castShadow = true; body.position.y = 1.1;
const visor = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 24), new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0x9de5ff, metalness:0.85, roughness:0.1 }));
visor.position.set(0, 1.4, 0.34);
player.add(body, visor);
scene.add(player);

const keys = {}; addEventListener('keydown', e => keys[e.code] = true); addEventListener('keyup', e => keys[e.code] = false);
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const state = { mode: 'adventure', hp: 100, xp: 0, shards: 0, speed: 7, cooldown: 0, enemiesDefeated: 0 };
const pickups = [], enemies = [];

function addCrystal(x,z){
  const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.45), new THREE.MeshStandardMaterial({ color:0x8f7bff, emissive:0x2f1b66, metalness:0.35, roughness:0.25 }));
  m.position.set(x, 0.8, z); m.castShadow = true; m.userData.type='crystal'; scene.add(m); pickups.push(m);
}
function addEnemy(x,z){
  const e = new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2), new THREE.MeshStandardMaterial({ color:0xff5d74, emissive:0x4b1424 }));
  e.position.set(x, 0.6, z); e.castShadow = true; e.userData.hp = 40; scene.add(e); enemies.push(e);
}
for(let i=0;i<24;i++) addCrystal((Math.random()-0.5)*80, (Math.random()-0.5)*80);
for(let i=0;i<16;i++) addEnemy((Math.random()-0.5)*80, (Math.random()-0.5)*80);

function setMode(m){ state.mode = m; document.getElementById('status').textContent = `Mode: ${m}`; }
document.getElementById('modeSelect').addEventListener('change', e => setMode(e.target.value));
document.getElementById('resetBtn').addEventListener('click', ()=>location.reload());

addEventListener('click', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1; mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObjects(enemies)[0];
  if (hit && state.cooldown <= 0 && state.mode !== 'collection') {
    const enemy = hit.object; enemy.userData.hp -= 20; state.cooldown = 0.25;
    if (enemy.userData.hp <= 0) {
      scene.remove(enemy); enemies.splice(enemies.indexOf(enemy),1); state.xp += 15; state.enemiesDefeated++;
    }
  }
});

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  state.cooldown = Math.max(0, state.cooldown - dt);

  const vx = (keys['KeyD']?1:0) - (keys['KeyA']?1:0);
  const vz = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);
  const boost = keys['ShiftLeft'] ? 1.9 : 1;
  if (vx || vz) {
    const v = new THREE.Vector3(vx, 0, vz).normalize().multiplyScalar(state.speed * boost * dt);
    player.position.add(v);
    player.rotation.y = Math.atan2(v.x, v.z);
  }

  pickups.forEach((c, idx) => {
    c.rotation.y += dt * 2;
    c.position.y = 0.8 + Math.sin(clock.elapsedTime * 2 + idx) * 0.08;
    if (player.position.distanceTo(c.position) < 1.2) {
      scene.remove(c); pickups.splice(idx, 1); state.shards++; state.xp += 6;
    }
  });

  enemies.forEach((e) => {
    if (state.mode === 'rivals' || state.mode === 'adventure') {
      const dir = player.position.clone().sub(e.position).setY(0).normalize();
      e.position.addScaledVector(dir, dt * 2.5);
      if (e.position.distanceTo(player.position) < 1.05) state.hp = Math.max(0, state.hp - dt * 12);
    }
  });

  camera.position.lerp(new THREE.Vector3(player.position.x, 6.4, player.position.z + 8.8), 0.08);
  camera.lookAt(player.position.x, 1.2, player.position.z);

  document.getElementById('stats').innerHTML = `<strong>Player</strong><br><span class='hp'>HP: ${state.hp.toFixed(0)}</span> | <span class='xp'>XP: ${state.xp}</span><br>Defeated: ${state.enemiesDefeated}`;
  document.getElementById('collection').innerHTML = `<strong>Collection</strong><br>Shards: ${state.shards}<br>Crystals left: ${pickups.length}<br>Enemies left: ${enemies.length}`;

  if (state.hp <= 0) document.getElementById('status').textContent = 'Defeat! Press Reset Run.';
  else if (pickups.length === 0) document.getElementById('status').textContent = 'Collection complete! Press Reset Run.';

  renderer.render(scene, camera);
}
setMode('adventure');
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
